const cv=document.getElementById('c'),x=cv.getContext('2d');
const ov=document.getElementById('ov'),t=document.getElementById('t'),m=document.getElementById('m'),btn=document.getElementById('b');
const face=new Image();face.src=IMG;
const aL=new Audio(LS),aN=new Audio(NS);aL.preload=aN.preload='auto';
let primed=false;
let ac=null,buf={};
function dec(s){const b=atob(s.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function initAudio(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
 [['L',LS],['N',NS]].forEach(([k,s])=>{ac.decodeAudioData(dec(s),d=>{buf[k]=d},()=>{})})}
 if(ac.state==='suspended')ac.resume()}catch(e){}}
function prime(){initAudio();if(primed)return;primed=true;[aL,aN].forEach(a=>{a.muted=true;const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})})}
function snd(a){const k=a===aL?'L':'N';
 if(ac&&buf[k]){try{const s=ac.createBufferSource();s.buffer=buf[k];s.connect(ac.destination);s.start(0);return}catch(e){}}
 try{a.pause();a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
const W=360,H=640,G=0.36,FL=-6.6,R=32,GAP=215,PW=62,GH=70,SP=2.1;
let bird,pipes,score,best=0,state='ready',frame=0;
try{best=+localStorage.getItem('fbest')||0}catch(e){}
function reset(){bird={y:H/2-40,v:0,r:0};pipes=[];score=0;frame=0}
reset();
function start(){prime();reset();state='play';ov.classList.add('hide')}
function flap(){initAudio();if(state==='play')bird.v=FL}
function die(){if(state!=='play')return;state='over';snd(aN);
 if(score>best){best=score;try{localStorage.setItem('fbest',best)}catch(e){}}
 t.textContent='Game Over';m.textContent='Score: '+score+'  •  Best: '+best;btn.textContent='Replay';ov.classList.remove('hide')}
btn.addEventListener('click',e=>{e.stopPropagation();start()});
function input(e){if(e.target===btn)return;if(state==='play'){e.preventDefault();flap()}}
cv.addEventListener('pointerdown',input);ov.addEventListener('pointerdown',e=>{});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='play')flap();else start()}});
let last=0,tm=0;
function update(k){
 if(state!=='play')return;
 frame+=k;bird.v+=G*k;bird.y+=bird.v*k;bird.r=Math.max(-.5,Math.min(1,bird.v/12));
 tm-=k;if(tm<=0){tm=115;pipes.push({x:W,top:70+Math.random()*(H-GH-GAP-140),p:false})}
 const bx=90;
 for(const p of pipes){p.x-=SP*k;
  if(!p.p&&p.x+PW<bx-R){p.p=true;score++;snd(aL)}
  if(bx+R-10>p.x&&bx-R+10<p.x+PW&&(bird.y-R+10<p.top||bird.y+R-10>p.top+GAP))die()}
 pipes=pipes.filter(p=>p.x>-PW);
 if(bird.y+R-6>H-GH)die();if(bird.y<R){bird.y=R;bird.v=0}
}
function pipe(px,y,h,flip){x.fillStyle='#4caf50';x.fillRect(px,y,PW,h);x.fillStyle='#2e7d32';x.fillRect(px,y,6,h);
 const cy=flip?y+h-24:y;x.fillStyle='#66bb6a';x.fillRect(px-4,cy,PW+8,24);x.strokeStyle='#1b5e20';x.lineWidth=2;x.strokeRect(px-4,cy,PW+8,24)}
function draw(){
 x.setTransform(2,0,0,2,0,0);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
 x.fillStyle='#70c5ce';x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<4;i++){const cx=((i*140-frame*.4)%520+520)%520-80;x.beginPath();x.arc(cx,100+i*50,26,0,7);x.arc(cx+28,108+i*50,20,0,7);x.arc(cx-26,110+i*50,18,0,7);x.fill()}
 for(const p of pipes){pipe(p.x,0,p.top,true);pipe(p.x,p.top+GAP,H-GH-p.top-GAP,false)}
 x.fillStyle='#ded895';x.fillRect(0,H-GH,W,GH);x.fillStyle='#8bc34a';x.fillRect(0,H-GH,W,12);
 x.save();x.translate(90,bird.y);x.rotate(bird.r);
 x.beginPath();x.arc(0,0,R+3,0,7);x.fillStyle='#fff';x.fill();
 x.beginPath();x.arc(0,0,R,0,7);x.save();x.clip();
 if(face.complete)x.drawImage(face,-R,-R,R*2,R*2);else{x.fillStyle='#fc0';x.fill()}
 x.restore();x.restore();
 x.font='bold 48px system-ui';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000';x.fillStyle='#fff';
 if(state!=='ready'){x.strokeText(score,W/2,80);x.fillText(score,W/2,80)}
}
function loop(n){const k=last?Math.min(2,(n-last)/16.667):1;last=n;update(k);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
